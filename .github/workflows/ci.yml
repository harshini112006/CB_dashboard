name: CI / CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm --prefix server ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1" # CI uses the Mongo service container, not the dev-only mongod download
      - run: npm --prefix client ci
      - name: Unit + integration tests
        run: npm test
      - name: Build client
        run: npm --prefix client run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t cb-dashboard:ci .

  deploy:
    # Continuous deployment: ask Render to redeploy when main is green.
    # Enable by adding the repository secret RENDER_DEPLOY_HOOK (Render -> Service -> Settings -> Deploy Hook).
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK not set - skipping deploy"; exit 0; fi
          curl -fsS -X POST "$HOOK"
