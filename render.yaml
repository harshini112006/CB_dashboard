# Render Blueprint: ONE web service that serves both the React app and the API.
# The only value you must provide is MONGODB_URI (Render asks for it when you create the service).
services:
  - type: web
    name: cb-dashboard
    runtime: node
    plan: free
    buildCommand: npm --prefix server install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true # redeploy on every push to the connected branch
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false # paste your MongoDB Atlas connection string in the Render dashboard
      - key: MONGODB_DB
        value: cb_dashboard
      # Optional extras (add in the Render dashboard if wanted; the app works without them):
      #   AUTH_USER / AUTH_PASSWORD / AUTH_SECRET  -> turns the login screen on
      #   ANTHROPIC_API_KEY                        -> enables the "AI summary" button
